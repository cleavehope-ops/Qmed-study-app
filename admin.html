<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Naya QMED admin</title>
<style>body{font-family:-apple-system,system-ui,sans-serif;background:#eef1fa;color:#0b1a5e;margin:0;padding:16px;font-size:19px}.c{background:#fff;border-radius:14px;padding:14px;margin:12px 0}button{font-size:20px;padding:12px 16px;border-radius:12px;border:0;background:#1f3fae;color:#fff;margin:4px}button.r{background:#b00020}input{font-size:20px;padding:10px;width:100%;box-sizing:border-box;margin:6px 0}table{border-collapse:collapse;width:100%;font-size:16px}td,th{border-bottom:1px solid #ddd;padding:6px;text-align:left}.big{font-size:40px;font-weight:700}textarea{width:100%;font-size:14px;height:60px;box-sizing:border-box}</style></head>
<body><h1>⚓ Naya QMED admin</h1><div id="o"></div>
<script>
var SB=window.__SB||'https://ddneudbfizxsnpeywuve.supabase.co',PK='sb_publishable_OYluRp5nfmzO9C2TVC0yzw_wp4mx5Pu',K=sessionStorage.getItem('qa_k')||'';
function rpc(f,a){return fetch(SB+'/rest/v1/rpc/'+f,{method:'POST',headers:{apikey:PK,Authorization:'Bearer '+PK,'Content-Type':'application/json'},body:JSON.stringify(a)}).then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.message||r.status);return j;});});}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function dt(s){return s?new Date(s).toLocaleString():'-';}
var O=document.getElementById('o');
function keyForm(err){O.innerHTML='<div class="c">Admin key:<input id="k" type="password" autocomplete="off"><button id="go">Open</button><p style="color:#b00020">'+(err||'')+'</p></div>';document.getElementById('go').onclick=function(){K=document.getElementById('k').value.trim();sessionStorage.setItem('qa_k',K);load();};}
function base(){return location.origin+location.pathname.replace(/[^\/]*$/,'');}
function load(){if(!K)return keyForm();O.innerHTML='<div class="c">⏳ Loading…</div>';rpc('admin_stats',{p_key:K}).then(draw).catch(function(e){sessionStorage.removeItem('qa_k');K='';keyForm(/not_admin/.test(e.message)?'Wrong key.':'Error: '+esc(e.message));});}
function draw(s){var h='<div class="c">👥 Users<div class="big">'+s.users+'</div>Active in last 7 days: <b>'+s.active_7d+'</b>'+(s.test_accounts?'<br><small>Test accounts: '+s.test_accounts+' <button class="r" id="delT">Delete test accounts</button></small>':'')+'</div>';
 h+='<div class="c"><b>🌍 By country</b><table>'+s.by_country.map(function(x){return '<tr><td>'+esc(x.country)+'</td><td>'+x.n+'</td></tr>';}).join('')+'</table></div>';
 h+='<div class="c"><b>🎟 Make a tester pass</b><input id="lbl" placeholder="Who is it for? (name)"><button data-k="day">1 day</button><button data-k="week">1 week</button><button data-k="month">1 month</button><div id="newp"></div><small>The time starts when they first open the link.</small></div>';
 h+='<div class="c"><b>Tester passes</b><table><tr><th>Who</th><th>Type</th><th>Ends</th><th>Country</th><th></th></tr>'+s.passes.map(function(p){return '<tr><td>'+esc(p.label||'-')+'</td><td>'+p.kind+'</td><td>'+(p.revoked?'❌ stopped':(p.expires_at?dt(p.expires_at):'not opened yet'))+(p.active?'':' (off)')+'</td><td>'+esc(p.country||'-')+'</td><td>'+(p.active?'<button class="r" data-rv="'+p.token+'">Stop</button>':'')+'</td></tr>';}).join('')+'</table></div>';
 h+='<div class="c"><b>Crew</b><table><tr><th>Name</th><th>Country</th><th>Joined</th><th>Last seen</th></tr>'+s.crew.map(function(c){return '<tr><td>'+esc(c.name)+'</td><td>'+esc(c.country)+'</td><td>'+dt(c.created_at)+'</td><td>'+dt(c.last_seen)+'</td></tr>';}).join('')+'</table></div><button id="rf">🔄 Refresh</button>';
 O.innerHTML=h;document.getElementById('rf').onclick=load;var dT=document.getElementById('delT');if(dT)dT.onclick=function(){if(confirm('Delete all zz_test_ accounts?'))rpc('admin_delete_tests',{p_key:K}).then(load);};
 O.querySelectorAll('[data-k]').forEach(function(b){b.onclick=function(){rpc('admin_make_pass',{p_key:K,p_kind:b.getAttribute('data-k'),p_label:document.getElementById('lbl').value}).then(function(t){var u=base()+'tester.html?p='+t;document.getElementById('newp').innerHTML='<p>Send this link (plus nothing else, no password needed):</p><textarea readonly>'+esc(u)+'</textarea>';setTimeout(function(){},0);}).catch(function(e){alert(e.message);});};});
 O.querySelectorAll('[data-rv]').forEach(function(b){b.onclick=function(){if(confirm('Stop this pass now?'))rpc('admin_revoke_pass',{p_key:K,p_pass:b.getAttribute('data-rv')}).then(load);};});}
load();
</script></body></html>
